[project]
name = "skills"
version = "0.1.0"
description = "Agent skills for Agent Skills clients"
license = "MIT"
readme = "README.md"
authors = [
    { name = "HongmingLiang", email = "hm.liang.dev@outlook.com" }
]
requires-python = ">=3.14"

# Development environment only. Every skill ships its own dependencies inline
# (PEP 723) and runs standalone, so this group exists for type checking and
# tooling; add a Python skill's dependencies here when it joins the repo.
[dependency-groups]
dev = [
    "nylas>=6.17.0",
    "pyright>=1.1.414",
    "requests>=2.32",
]

[tool.ruff]
# Installed third-party skills live under .agents and are not ours to lint.
extend-exclude = [".agents"]

[tool.pyright]
venvPath = "."
venv = ".venv"
